name: Python Code Test

# This triggers the action whenever you push code or create a pull request
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Grabs your code from the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Sets up the Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # You can change this to match your DisCloud version

    # 3. Installs your requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Runs your test script (adjust the command to match how you test your code)
    - name: Run tests
      run: python main.py
        # If you are just testing if main.py compiles without syntax errors:
        # python -m py_compile main.py
        
        # OR if you are using a testing framework like pytest:
        # pytest
